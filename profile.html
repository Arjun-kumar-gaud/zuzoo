<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - Zuzoo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family:'Inter',sans-serif; background:#f4f6fa; }
:root { --z-purple:#6a1b9a; --z-navy:#0d1b2a; }
.text-purple { color:var(--z-purple)!important; }
.z-header { background:#fff; box-shadow:0 2px 12px rgba(13,27,42,.08); }
.z-logo { font-weight:700; font-size:1.6rem; color:var(--z-purple); text-decoration:none; }
.z-logo span { color:var(--z-navy); }
.btn-purple { background:var(--z-purple); color:#fff; border:none; }
.btn-purple:hover { background:#8e24aa; color:#fff; }
.card-box { background:#fff; border-radius:14px; padding:20px; box-shadow:0 4px 12px rgba(0,0,0,.05); margin-bottom:16px; }
.addr-card { border:1px solid #e0e4ec; border-radius:12px; padding:16px; margin-bottom:12px; position:relative; }
.addr-type-badge { background:#eaeef5; color:var(--z-navy); font-size:.7rem; padding:.15rem .6rem; border-radius:20px; font-weight:600; text-transform:uppercase; }
</style>
</head>
<body>

<header class="z-header py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="index.html" class="z-logo">ZUZ<span>OO</span></a>
    <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
  </div>
</header>

<div class="container py-4">
  <h4 class="mb-4"><i class="bi bi-person-circle text-purple"></i> My Profile</h4>

  <div class="row g-4">
    <div class="col-lg-5">
      <div class="card-box">
        <h6 class="fw-bold mb-3">Personal Info</h6>
        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="pName">
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-control" id="pPhone" pattern="[0-9]{10}" maxlength="10">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="pEmail" disabled>
          </div>
          <button class="btn btn-purple w-100" type="submit">Save Changes</button>
        </form>
      </div>
    </div>

    <div class="col-lg-7" id="addresses">
      <div class="card-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold mb-0">Saved Addresses</h6>
          <button class="btn btn-purple btn-sm" data-bs-toggle="modal" data-bs-target="#addrModal">
            <i class="bi bi-plus"></i> Add Address
          </button>
        </div>
        <div id="addressList"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add Address Modal -->
<div class="modal fade" id="addrModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addrForm">
        <div class="modal-header">
          <h5 class="modal-title">Add New Address</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="aName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone *</label>
              <input type="tel" class="form-control" id="aPhone" required pattern="[0-9]{10}" maxlength="10">
            </div>
            <div class="col-md-4">
              <label class="form-label">Pincode *</label>
              <input type="text" class="form-control" id="aPincode" required pattern="[0-9]{6}" maxlength="6">
            </div>
            <div class="col-md-4">
              <label class="form-label">City *</label>
              <input type="text" class="form-control" id="aCity" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">State *</label>
              <input type="text" class="form-control" id="aState" required>
            </div>
            <div class="col-12">
              <label class="form-label">Address *</label>
              <textarea class="form-control" id="aAddress" rows="2" required></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Landmark</label>
              <input type="text" class="form-control" id="aLandmark">
            </div>
            <div class="col-md-6">
              <label class="form-label">Type</label>
              <select class="form-select" id="aType">
                <option value="home">Home</option>
                <option value="work">Work</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="aDefault">
                <label class="form-check-label" for="aDefault">Set as default address</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-purple">Save Address</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
let currentUser = null;

(async function init() {
  currentUser = await getCurrentUser();
  if (!currentUser) {
    window.location.href = "login.html?redirect=profile.html";
    return;
  }

  document.getElementById("pEmail").value = currentUser.email;
  const p = await getProfile();
  if (p) {
    document.getElementById("pName").value = p.full_name || "";
    document.getElementById("pPhone").value = p.phone || "";
  }

  await loadAddressList();
})();

// Profile form
document.getElementById("profileForm").addEventListener("submit", async e => {
  e.preventDefault();
  const { error } = await updateProfile({
    full_name: document.getElementById("pName").value.trim(),
    phone: document.getElementById("pPhone").value.trim()
  });
  if (error) { toast(error.message, "danger"); return; }
  toast("Profile updated ✓");
});

// Address list
async function loadAddressList() {
  const list = await getAddresses();
  const el = document.getElementById("addressList");
  if (!list.length) {
    el.innerHTML = `<div class="text-center py-4 text-muted">
      <i class="bi bi-geo-alt" style="font-size:2rem;"></i>
      <p class="mt-2 mb-0">No saved addresses</p>
    </div>`;
    return;
  }
  el.innerHTML = list.map(a => `
    <div class="addr-card">
      <div class="d-flex align-items-center gap-2 mb-1">
        <strong>${escapeHtml(a.full_name)}</strong>
        <span class="addr-type-badge">${escapeHtml(a.address_type)}</span>
        ${a.is_default ? '<span class="badge" style="background:var(--z-purple);font-size:.65rem;">DEFAULT</span>' : ''}
      </div>
      <div class="small">
        ${escapeHtml(a.address_line)}, ${a.landmark ? escapeHtml(a.landmark) + ', ' : ''}
        ${escapeHtml(a.city)}, ${escapeHtml(a.state)} - <strong>${escapeHtml(a.pincode)}</strong>
      </div>
      <div class="small mt-1"><i class="bi bi-telephone"></i> ${escapeHtml(a.phone)}</div>
      <div class="mt-2 d-flex gap-2">
        ${!a.is_default ? `<button class="btn btn-sm btn-outline-purple" style="border:1px solid var(--z-purple);color:var(--z-purple);" onclick="makeDefault(${a.id})">Set Default</button>` : ''}
        <button class="btn btn-sm btn-outline-danger" onclick="delAddr(${a.id})">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  `).join("");
}

async function makeDefault(id) {
  const user = await getCurrentUser();
  await supabaseClient.from("user_addresses").update({ is_default: false }).eq("user_id", user.id);
  await supabaseClient.from("user_addresses").update({ is_default: true }).eq("id", id);
  toast("Default address updated");
  loadAddressList();
}

async function delAddr(id) {
  if (!confirm("Delete this address?")) return;
  await deleteAddress(id);
  toast("Deleted");
  loadAddressList();
}

// Add address form
document.getElementById("addrForm").addEventListener("submit", async e => {
  e.preventDefault();
  const addr = {
    full_name: document.getElementById("aName").value.trim(),
    phone: document.getElementById("aPhone").value.trim(),
    pincode: document.getElementById("aPincode").value.trim(),
    city: document.getElementById("aCity").value.trim(),
    state: document.getElementById("aState").value.trim(),
    address_line: document.getElementById("aAddress").value.trim(),
    landmark: document.getElementById("aLandmark").value.trim(),
    address_type: document.getElementById("aType").value,
    is_default: document.getElementById("aDefault").checked
  };
  const { error } = await saveAddress(addr);
  if (error) { toast(error.message, "danger"); return; }
  toast("Address added ✓");
  bootstrap.Modal.getInstance(document.getElementById("addrModal")).hide();
  document.getElementById("addrForm").reset();
  loadAddressList();
});
</script>
</body>
</html>
