<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuzoo - Online Shopping in India</title>
<meta name="description" content="Shop mobiles, electronics, fashion at Zuzoo.in">
<link rel="canonical" href="https://zuzoo.in/">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #f4f6fa; margin: 0; padding-bottom: 70px; }
:root { --z-purple:#6a1b9a; --z-purple-light:#8e24aa; --z-navy:#0d1b2a; --z-gold:#ffb300; }
.bg-purple { background: var(--z-purple) !important; }
.text-purple { color: var(--z-purple) !important; }
.text-navy { color: var(--z-navy) !important; }
.z-header { background:#fff; box-shadow:0 2px 12px rgba(13,27,42,.08); position:sticky; top:0; z-index:1030; }
.z-logo { font-weight:700; font-size:1.8rem; color:var(--z-purple); text-decoration:none; }
.z-logo span { color: var(--z-navy); }
.z-search-bar { border-radius:8px; border:1px solid #e0e4ec; background:#f8f9fc; padding:.45rem 1rem; width:100%; max-width:480px; }
.z-search-bar:focus { border-color:var(--z-purple); box-shadow:0 0 0 .2rem rgba(106,27,154,.2); outline:none; background:#fff; }
.z-category-nav { background:#fff; border-bottom:1px solid #eaeef5; padding:.5rem 0; overflow-x:auto; white-space:nowrap; }
.z-cat-link { display:inline-block; padding:.35rem 1.2rem; margin:0 .2rem; font-weight:500; color:var(--z-navy); text-decoration:none; border-radius:30px; font-size:.9rem; transition:.2s; }
.z-cat-link i { margin-right:6px; }
.z-cat-link:hover, .z-cat-link.active { background:var(--z-purple); color:#fff; }
.product-card { border:none; border-radius:16px; background:#fff; transition:.2s; box-shadow:0 4px 12px rgba(13,27,42,.04); height:100%; display:flex; flex-direction:column; }
.product-card:hover { transform:translateY(-4px); box-shadow:0 12px 24px rgba(106,27,154,.08); }
.product-img { background:#f0f2f6; border-radius:16px 16px 0 0; text-align:center; height:180px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.product-img img { max-height:100%; max-width:100%; object-fit:contain; }
.product-title { font-weight:600; font-size:.95rem; color:var(--z-navy); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.4em; }
.product-price { font-weight:700; color:var(--z-purple); font-size:1.15rem; }
.product-old-price { color:#8c9aa8; font-size:.85rem; text-decoration:line-through; margin-left:6px; }
.product-offer { background:#ffe8e8; color:#c62828; padding:.1rem .7rem; border-radius:30px; font-size:.72rem; font-weight:600; }
.product-category-badge { background:#eaeef5; color:var(--z-navy); font-size:.65rem; padding:.15rem .6rem; border-radius:20px; font-weight:600; display:inline-block; }
.btn-purple { background:var(--z-purple); color:#fff; border:none; border-radius:8px; font-weight:600; }
.btn-purple:hover { background:var(--z-purple-light); color:#fff; }
.mobile-bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eaeef5; display:flex; justify-content:space-around; align-items:center; padding:6px 0 10px; z-index:1050; }
.mobile-bottom-nav a { display:flex; flex-direction:column; align-items:center; font-size:.7rem; color:#5a6a7a; text-decoration:none; padding:0 8px; position:relative; }
.mobile-bottom-nav a i { font-size:1.5rem; margin-bottom:2px; }
.mobile-bottom-nav a.active { color:var(--z-purple); font-weight:600; }
.cart-count-badge { background:var(--z-purple); color:#fff; border-radius:40px; padding:.1rem .5rem; font-size:.65rem; position:absolute; top:-4px; right:-8px; }
.hero-banner { background:linear-gradient(145deg,var(--z-navy),#1f3a57); border-radius:20px; padding:2rem 1.8rem; color:#fff; margin:1.2rem 0; }
.hero-banner h1 { font-weight:700; font-size:2rem; }
.section-title { font-weight:700; color:var(--z-navy); border-left:6px solid var(--z-purple); padding-left:16px; }
@media (max-width:767px) { .mobile-bottom-nav { display:flex; } .product-img { height:140px; } .hero-banner h1 { font-size:1.5rem; } }
@media (min-width:768px) { .mobile-bottom-nav { display:none; } }
</style>
</head>
<body>

<!-- HEADER -->
<header class="z-header">
  <div class="container">
    <div class="row align-items-center g-2 py-2">
      <div class="col-2 d-none d-md-flex align-items-center">
        <a href="index.html" class="z-logo">ZUZ<span>OO</span></a>
      </div>
      <div class="col-9 col-md-7">
        <div class="d-flex align-items-center bg-light rounded-4 px-2 py-1" style="border:1px solid #e2e8f0;">
          <i class="bi bi-search text-secondary me-2"></i>
          <input id="searchInput" type="text" class="z-search-bar border-0 bg-transparent" placeholder="Search products..." />
        </div>
      </div>
      <div class="col-3 col-md-3 d-flex justify-content-end align-items-center gap-3">
        <div id="userArea"></div>
        <a href="cart.html" class="text-navy text-decoration-none position-relative">
          <i class="bi bi-cart fs-4"></i>
          <span class="cart-count-badge">0</span>
        </a>
      </div>
    </div>
  </div>
</header>

<!-- CATEGORY NAV -->
<div class="z-category-nav">
  <div class="container d-flex flex-nowrap align-items-center" id="categoryNav">
    <a href="#" class="z-cat-link active" data-cat="all"><i class="bi bi-grid-3x3-gap-fill"></i> All</a>
  </div>
</div>

<!-- MAIN -->
<div class="container">
  <div class="hero-banner">
    <h1>Online Shopping in India<br><span style="color:var(--z-gold);">Great Deals on Top Products</span></h1>
    <p class="opacity-75">Electronics, fashion, home & more — free delivery</p>
  </div>

  <h3 class="section-title mb-3" id="sectionTitle"><i class="bi bi-lightning-fill text-purple"></i> Trending now</h3>
  <div id="productsGrid" class="row g-3 g-md-4">
    <div class="col-12 text-center py-5">
      <div class="spinner-border text-purple"></div>
      <p class="text-muted mt-3">Products loading...</p>
    </div>
  </div>

  <div class="my-5 text-center text-muted small">
    <p>© 2026 Zuzoo — India's largest online store. <span class="text-purple">#ShopWithZuzoo</span></p>
  </div>
</div>

<!-- MOBILE BOTTOM NAV -->
<div class="mobile-bottom-nav">
  <a href="index.html" class="active"><i class="bi bi-house-door-fill"></i><span>Home</span></a>
  <a href="orders.html"><i class="bi bi-bag-check"></i><span>Orders</span></a>
  <a href="cart.html" class="position-relative">
    <i class="bi bi-cart-fill"></i>
    <span class="cart-count-badge">0</span>
    <span>Cart</span>
  </a>
  <a href="login.html" id="mobileUserLink"><i class="bi bi-person-fill"></i><span>User</span></a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
// ============ STATE ============
let allProducts = [];
let categories = [];
let activeCategory = "all";
let searchTerm = "";

const grid = document.getElementById("productsGrid");
const catNav = document.getElementById("categoryNav");
const sectionTitle = document.getElementById("sectionTitle");

// ============ LOAD CATEGORIES ============
async function loadCategories() {
  const { data, error } = await supabaseClient
    .from("categories").select("*").eq("is_active", true).order("sort_order");
  if (error) { console.error(error); return; }
  categories = data || [];
  catNav.innerHTML = `<a href="#" class="z-cat-link active" data-cat="all">
    <i class="bi bi-grid-3x3-gap-fill"></i> All</a>` +
    categories.map(c => `
      <a href="#" class="z-cat-link" data-cat="${escapeHtml(c.slug)}">
        <i class="bi ${escapeHtml(c.icon || 'bi-tag')}"></i> ${escapeHtml(c.name)}
      </a>`).join("");
  catNav.querySelectorAll(".z-cat-link").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      catNav.querySelectorAll(".z-cat-link").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      activeCategory = el.dataset.cat;
      renderProducts();
    });
  });
}

// ============ LOAD PRODUCTS ============
async function loadProducts() {
  const { data, error } = await supabaseClient
    .from("products").select("*").order("createdAt", { ascending: false });
  if (error) {
    grid.innerHTML = `<div class="col-12"><div class="alert alert-danger">Failed to load products: ${escapeHtml(error.message)}</div></div>`;
    return;
  }
  allProducts = data || [];
  renderProducts();
}

// ============ RENDER ============
function renderProducts() {
  let list = allProducts;

  if (activeCategory !== "all") {
    const cat = categories.find(c => c.slug === activeCategory);
    list = list.filter(p => {
      if (cat && p.category_id) return p.category_id === cat.id;
      return (p.category || "").toLowerCase() === activeCategory.replace(/-/g, " ");
    });
  }

  if (searchTerm) {
    const t = searchTerm.toLowerCase();
    list = list.filter(p => (p.name || "").toLowerCase().includes(t));
  }

  const catName = activeCategory === "all" ? "Trending now"
    : (categories.find(c => c.slug === activeCategory)?.name || activeCategory);
  sectionTitle.innerHTML = `<i class="bi bi-lightning-fill text-purple"></i> ${escapeHtml(catName)}`;

  if (!list.length) {
    grid.innerHTML = `<div class="col-12 text-center py-5">
      <i class="bi bi-box-seam" style="font-size:3rem;color:#aaa;"></i>
      <h5 class="mt-3">No products found</h5>
      <p class="text-muted">Try another category or search.</p>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(p => productCard(p)).join("");
}

function productCard(p) {
  const price = Number(p.price || 0);
  const salePrice = p.salePrice != null && p.salePrice !== "" ? Number(p.salePrice) : null;
  let offer = "";
  let priceHtml = `<span class="product-price">₹${formatPrice(price)}</span>`;

  if (salePrice != null && salePrice < price && price > 0) {
    const disc = Math.round(((price - salePrice) / price) * 100);
    offer = `<span class="product-offer">${disc}% off</span>`;
    priceHtml = `<span class="product-price">₹${formatPrice(salePrice)}</span>
                 <span class="product-old-price">₹${formatPrice(price)}</span>`;
  }

  const stock = Number(p.stock || 0);
  let stockHtml = "";
  if (stock <= 0) stockHtml = `<small class="text-danger fw-semibold">Out of stock</small>`;
  else if (stock <= 5) stockHtml = `<small class="text-warning fw-semibold">Only ${stock} left</small>`;

  const productJson = escapeHtml(JSON.stringify(p));

  return `
    <div class="col-6 col-md-4 col-lg-3">
      <div class="product-card p-2">
        <div class="product-img">
          <img src="${escapeHtml(p.imageUrl || '')}" alt="${escapeHtml(p.name)}" loading="lazy"
               onerror="this.src='https://placehold.co/400x400/f0f2f6/777?text=No+Image'">
        </div>
        <div class="p-2 d-flex flex-column flex-grow-1">
          <div class="product-title">${escapeHtml(p.name || "Unnamed")}</div>
          <div class="mt-1">${priceHtml}</div>
          <div class="mt-1">${offer}</div>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <div>${stockHtml}</div>
          </div>
          <span class="product-category-badge mt-2">
            <i class="bi bi-tag me-1"></i>${escapeHtml(p.category || "Other")}
          </span>
          <button class="btn btn-purple btn-sm mt-2 w-100 add-cart-btn"
                  ${stock <= 0 ? "disabled" : ""}
                  data-product='${productJson.replace(/'/g, "&#39;")}'>
            <i class="bi bi-cart-plus me-1"></i>${stock <= 0 ? "Out of Stock" : "Add to Cart"}
          </button>
        </div>
      </div>
    </div>`;
}

// Add to cart delegate
document.addEventListener("click", e => {
  const btn = e.target.closest(".add-cart-btn");
  if (!btn) return;
  try {
    const p = JSON.parse(btn.dataset.product.replace(/&#39;/g, "'"));
    addToCart(p, 1);
  } catch (err) { console.error(err); }
});

// Search
document.getElementById("searchInput").addEventListener("input", e => {
  searchTerm = e.target.value.trim();
  renderProducts();
});

// ============ INIT ============
(async function init() {
  await loadCategories();
  await loadProducts();
  updateCartBadges();
})();
</script>
</body>
</html>
