<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Zuzoo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family:'Inter',sans-serif; background:#f4f6fa; }
:root { --z-purple:#6a1b9a; --z-navy:#0d1b2a; }
.text-purple { color:var(--z-purple)!important; }
.z-header { background:#fff; box-shadow:0 2px 12px rgba(13,27,42,.08); }
.z-logo { font-weight:700; font-size:1.6rem; color:var(--z-purple); text-decoration:none; }
.z-logo span { color:var(--z-navy); }
.order-card { background:#fff; border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
.status-badge { padding:.25rem .75rem; border-radius:30px; font-size:.75rem; font-weight:600; }
.status-pending { background:#fff3cd; color:#856404; }
.status-shipped { background:#cce5ff; color:#004085; }
.status-delivered { background:#d4edda; color:#155724; }
.status-cancelled { background:#f8d7da; color:#721c24; }
</style>
</head>
<body>

<header class="z-header py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="index.html" class="z-logo">ZUZ<span>OO</span></a>
    <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Shop</a>
  </div>
</header>

<div class="container py-4">
  <h3 class="mb-4"><i class="bi bi-bag-check text-purple"></i> My Orders</h3>
  <div id="ordersList">
    <div class="text-center py-5">
      <div class="spinner-border text-purple"></div>
      <p class="mt-3 text-muted">Loading orders...</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(async function init() {
  const user = await getCurrentUser();
  if (!user) {
    window.location.href = "login.html?redirect=orders.html";
    return;
  }

  const { data: orders, error } = await supabaseClient
    .from("orders")
    .select(`*, order_items(*)`)
    .eq("user_id", user.id)
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("ordersList").innerHTML = `
      <div class="alert alert-danger">Failed to load orders: ${escapeHtml(error.message)}</div>`;
    return;
  }

  if (!orders || !orders.length) {
    document.getElementById("ordersList").innerHTML = `
      <div class="text-center py-5 bg-white rounded-4">
        <i class="bi bi-bag-x" style="font-size:4rem;color:#ccc;"></i>
        <h5 class="mt-3">No orders yet</h5>
        <a href="index.html" class="btn btn-purple mt-2" style="background:var(--z-purple);color:#fff;">
          Start Shopping
        </a>
      </div>`;
    return;
  }

  document.getElementById("ordersList").innerHTML = orders.map(o => {
    const statusClass = "status-" + (o.status || "pending");
    const date = new Date(o.created_at).toLocaleDateString("en-IN", {
      day:"numeric", month:"short", year:"numeric"
    });
    return `
      <div class="order-card">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
          <div>
            <div class="fw-bold">Order #${escapeHtml(o.order_number)}</div>
            <small class="text-muted">Placed on ${date}</small>
          </div>
          <span class="status-badge ${statusClass}">${escapeHtml(o.status || "pending").toUpperCase()}</span>
        </div>

        ${(o.order_items || []).map(it => `
          <div class="d-flex gap-2 align-items-center mb-2 pb-2 border-bottom">
            <img src="${escapeHtml(it.product_image)}" style="width:50px;height:50px;object-fit:contain;background:#f0f2f6;border-radius:8px;"
                 onerror="this.src='https://placehold.co/60x60?text=?'">
            <div class="flex-grow-1">
              <div style="font-size:.9rem;font-weight:600;">${escapeHtml(it.product_name)}</div>
              <small class="text-muted">Qty: ${it.quantity} × ₹${formatPrice(it.price)}</small>
            </div>
            <strong>₹${formatPrice(it.price * it.quantity)}</strong>
          </div>
        `).join("")}

        <div class="d-flex justify-content-between pt-2">
          <div>
            <small class="text-muted d-block">Shipping to:</small>
            <small>${escapeHtml(o.full_name || "")}, ${escapeHtml(o.city || "")}</small>
          </div>
          <div class="text-end">
            <small class="text-muted d-block">Total</small>
            <strong class="text-purple fs-5">₹${formatPrice(o.total)}</strong>
          </div>
        </div>
      </div>`;
  }).join("");
})();
</script>
</body>
</html>
