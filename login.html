<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Sign Up - Zuzoo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family:'Inter',sans-serif; background:linear-gradient(145deg,#0d1b2a,#1f3a57); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
:root { --z-purple:#6a1b9a; }
.btn-purple { background:var(--z-purple); color:#fff; border:none; }
.btn-purple:hover { background:#8e24aa; color:#fff; }
.auth-card { background:#fff; border-radius:20px; padding:32px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.z-logo { font-weight:700; font-size:2rem; color:var(--z-purple); text-decoration:none; text-align:center; display:block; margin-bottom:6px; }
.z-logo span { color:#0d1b2a; }
.tab-btn { border:none; background:transparent; padding:8px 16px; font-weight:600; color:#888; border-bottom:3px solid transparent; }
.tab-btn.active { color:var(--z-purple); border-bottom-color:var(--z-purple); }
</style>
</head>
<body>

<div class="auth-card">
  <a href="index.html" class="z-logo">ZUZ<span>OO</span></a>
  <p class="text-center text-muted mb-4" style="font-size:.9rem;">Your one-stop shop for everything</p>

  <div class="d-flex justify-content-center mb-4">
    <button class="tab-btn active" id="tabLogin">Login</button>
    <button class="tab-btn" id="tabSignup">Sign Up</button>
  </div>

  <!-- LOGIN -->
  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="loginEmail" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="loginPassword" required minlength="6">
    </div>
    <button type="submit" class="btn btn-purple w-100 py-2" id="loginBtn">Login</button>
  </form>

  <!-- SIGNUP -->
  <form id="signupForm" style="display:none;">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" id="signupName" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="signupEmail" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="signupPassword" required minlength="6">
      <small class="text-muted">Min 6 characters</small>
    </div>
    <button type="submit" class="btn btn-purple w-100 py-2" id="signupBtn">Create Account</button>
  </form>

  <p class="text-center mt-3 mb-0">
    <a href="index.html" class="text-decoration-none" style="color:#666;"><i class="bi bi-arrow-left"></i> Back to store</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const redirectUrl = params.get("redirect") || "index.html";

// Check if already logged in
(async () => {
  const u = await getCurrentUser();
  if (u) window.location.href = redirectUrl;
})();

// Tabs
document.getElementById("tabLogin").onclick = () => {
  document.getElementById("tabLogin").classList.add("active");
  document.getElementById("tabSignup").classList.remove("active");
  document.getElementById("loginForm").style.display = "";
  document.getElementById("signupForm").style.display = "none";
};
document.getElementById("tabSignup").onclick = () => {
  document.getElementById("tabSignup").classList.add("active");
  document.getElementById("tabLogin").classList.remove("active");
  document.getElementById("signupForm").style.display = "";
  document.getElementById("loginForm").style.display = "none";
};

// LOGIN
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Logging in...`;

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  const { error } = await signIn(email, password);
  if (error) {
    toast(error.message, "danger");
    btn.disabled = false;
    btn.textContent = "Login";
    return;
  }
  toast("Welcome back! ✓");
  setTimeout(() => window.location.href = redirectUrl, 700);
});

// SIGNUP
document.getElementById("signupForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("signupBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating...`;

  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  const { data, error } = await signUp(email, password, name);
  if (error) {
    toast(error.message, "danger");
    btn.disabled = false;
    btn.textContent = "Create Account";
    return;
  }

  // Try to login immediately (if email confirmation disabled)
  const { error: signInErr } = await signIn(email, password);
  if (signInErr) {
    toast("Account created. Check email to confirm.", "info");
    btn.disabled = false;
    btn.textContent = "Create Account";
    return;
  }

  toast("Account created! Welcome ✓");
  setTimeout(() => window.location.href = redirectUrl, 700);
});
</script>
</body>
</html>
