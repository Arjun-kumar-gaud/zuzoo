<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Zuzoo - Productsii</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }

    .topbar h1 {
      font-size: 28px;
    }

    .topbar p {
      color: #777;
      margin-top: 5px;
    }

    .back-btn {
      text-decoration: none;
      background: #222;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 21px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #6c5ce7;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .image-box {
      border: 2px dashed #ddd;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    #imagePreview {
      max-width: 180px;
      max-height: 180px;
      margin: 15px auto 0;
      display: none;
      border-radius: 10px;
      object-fit: cover;
    }

    .add-btn {
      margin-top: 20px;
      width: 100%;
      border: none;
      background: #6c5ce7;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #5849d6;
    }

    .add-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #e8f8ef;
      color: #168344;
    }

    .error {
      background: #ffe9e9;
      color: #c62828;
    }

    .products-table {
      width: 100%;
      border-collapse: collapse;
    }

    .products-table th,
    .products-table td {
      padding: 13px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    .products-table th {
      background: #fafafa;
    }

    .product-img {
      width: 55px;
      height: 55px;
      border-radius: 8px;
      object-fit: cover;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
    }

    .delete-btn {
      border: none;
      background: #ffe5e5;
      color: #d63031;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media(max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .card {
        padding: 18px;
        overflow-x: auto;
      }

      .products-table {
        min-width: 700px;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <!-- TOP BAR -->

  <div class="topbar">

    <div>
      <h1>Products</h1>

      <p>
        Manage your Zuzoo products
      </p>
    </div>

    <a href="dashboard.html"
       class="back-btn">
      ← Dashboard
    </a>

  </div>


  <!-- ADD PRODUCT -->

  <div class="card">

    <h2>➕ Add New Product</h2>

    <form id="productForm">

      <div class="form-grid">

        <div class="form-group">

          <label>
            Product Name *
          </label>

          <input
            type="text"
            id="productName"
            placeholder="Enter product name"
            required>

        </div>


        <div class="form-group">

          <label>
            Category *
          </label>

          <select id="category" required>

            <option value="">
              Select Category
            </option>

            <option value="Fashion">
              Fashion
            </option>

            <option value="Electronics">
              Electronics
            </option>

            <option value="Beauty">
              Beauty
            </option>

            <option value="Home">
              Home
            </option>

            <option value="Accessories">
              Accessories
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>
            Price *
          </label>

          <input
            type="number"
            id="price"
            placeholder="₹ 0"
            min="0"
            step="0.01"
            required>

        </div>


        <div class="form-group">

          <label>
            Sale Price
          </label>

          <input
            type="number"
            id="salePrice"
            placeholder="₹ 0"
            min="0"
            step="0.01">

        </div>


        <div class="form-group">

          <label>
            Stock *
          </label>

          <input
            type="number"
            id="stock"
            placeholder="Enter stock quantity"
            min="0"
            required>

        </div>


        <div class="form-group">

          <label>
            Product Image *
          </label>

          <div class="image-box">

            <input
              type="file"
              id="productImage"
              accept="image/*"
              required>

            <img
              id="imagePreview"
              alt="Image Preview">

          </div>

        </div>


        <div class="form-group full">

          <label>
            Description *
          </label>

          <textarea
            id="description"
            placeholder="Enter product description"
            required></textarea>

        </div>

      </div>


      <button
        type="submit"
        class="add-btn"
        id="addProductBtn">

        Add Product

      </button>


      <div
        id="message"
        class="message">
      </div>

    </form>

  </div>


  <!-- PRODUCT LIST -->

  <div class="card">

    <h2>📦 All Products</h2>

    <div id="productsContainer">

      <div class="loading">
        Loading products...
      </div>

    </div>

  </div>

</div>


<script type="module">

  import {
    auth,
    db
  } from "./js/firebase.js";


  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


  import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  /*
    Cloudflare Worker URL
  */

  const WORKER_URL =
    "https://zuzoo-image-upload.gaudarjunkumar153.workers.dev";


  const productForm =
    document.getElementById("productForm");


  const imageInput =
    document.getElementById("productImage");


  const imagePreview =
    document.getElementById("imagePreview");


  const message =
    document.getElementById("message");


  const addProductBtn =
    document.getElementById("addProductBtn");


  const productsContainer =
    document.getElementById("productsContainer");


  let selectedImage = null;


  /*
    AUTH CHECK
  */

  onAuthStateChanged(auth, (user) => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }

    loadProducts();

  });


  /*
    IMAGE PREVIEW
  */

  imageInput.addEventListener(
    "change",
    function () {

      selectedImage =
        this.files[0];


      if (!selectedImage) {

        imagePreview.style.display =
          "none";

        return;

      }


      if (!selectedImage.type.startsWith("image/")) {

        showMessage(
          "Please select a valid image.",
          "error"
        );

        this.value = "";

        selectedImage = null;

        return;

      }


      /*
        5 MB limit
      */

      if (selectedImage.size > 5 * 1024 * 1024) {

        showMessage(
          "Image must be smaller than 5 MB.",
          "error"
        );

        this.value = "";

        selectedImage = null;

        imagePreview.style.display =
          "none";

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function (e) {

          imagePreview.src =
            e.target.result;

          imagePreview.style.display =
            "block";

        };


      reader.readAsDataURL(selectedImage);

    }
  );


  /*
    CONVERT FILE → BASE64
  */

  function fileToBase64(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload =
          () => {

            const result =
              reader.result;


            /*
              Remove:
              data:image/png;base64,
            */

            const base64 =
              result.split(",")[1];


            resolve(base64);

          };


        reader.onerror =
          reject;


        reader.readAsDataURL(file);

      }
    );

  }


  /*
    ADD PRODUCT
  */

  productForm.addEventListener(
    "submit",
    async function (e) {

      e.preventDefault();


      if (!selectedImage) {

        showMessage(
          "Please select a product image.",
          "error"
        );

        return;

      }


      try {

        addProductBtn.disabled =
          true;


        addProductBtn.textContent =
          "Uploading Image...";


        const name =
          document
            .getElementById("productName")
            .value
            .trim();


        const category =
          document
            .getElementById("category")
            .value;


        const price =
          Number(
            document
              .getElementById("price")
              .value
          );


        const salePriceValue =
          document
            .getElementById("salePrice")
            .value;


        const salePrice =
          salePriceValue === ""
            ? null
            : Number(salePriceValue);


        const stock =
          Number(
            document
              .getElementById("stock")
              .value
          );


        const description =
          document
            .getElementById("description")
            .value
            .trim();


        /*
          FILE → BASE64
        */

        const fileBase64 =
          await fileToBase64(
            selectedImage
          );


        /*
          SEND IMAGE TO CLOUDFLARE WORKER
        */

        const uploadResponse =
          await fetch(
            WORKER_URL,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  fileName:
                    selectedImage.name,

                  fileBase64:
                    fileBase64

                })

            }
          );


        const uploadData =
          await uploadResponse.json();


        if (!uploadResponse.ok ||
            !uploadData.success) {

          throw new Error(
            uploadData.message ||
            "Image upload failed."
          );

        }


        const imageUrl =
          uploadData.imageUrl;


        /*
          SAVE PRODUCT IN FIRESTORE
        */

        addProductBtn.textContent =
          "Saving Product...";


        await addDoc(
          collection(
            db,
            "products"
          ),
          {

            name:
              name,

            category:
              category,

            price:
              price,

            salePrice:
              salePrice,

            stock:
              stock,

            description:
              description,

            imageUrl:
              imageUrl,

            githubPath:
              uploadData.path,

            createdAt:
              serverTimestamp()

          }
        );


        /*
          SUCCESS
        */

        showMessage(
          "Product added successfully! 🎉",
          "success"
        );


        productForm.reset();


        imagePreview.style.display =
          "none";


        selectedImage =
          null;


        loadProducts();


      } catch (error) {

        console.error(
          "ADD PRODUCT ERROR:",
          error
        );


        showMessage(
          "Error: " +
          error.message,
          "error"
        );

      }


      addProductBtn.disabled =
        false;


      addProductBtn.textContent =
        "Add Product";

    }
  );


  /*
    LOAD PRODUCTS
  */

  async function loadProducts() {

    try {

      productsContainer.innerHTML =
        `<div class="loading">
          Loading products...
        </div>`;


      const snapshot =
        await getDocs(
          collection(
            db,
            "products"
          )
        );


      if (snapshot.empty) {

        productsContainer.innerHTML =
          `<div class="empty">
            No products added yet.
          </div>`;

        return;

      }


      let html = `

        <table class="products-table">

          <thead>

            <tr>

              <th>Image</th>

              <th>Name</th>

              <th>Category</th>

              <th>Price</th>

              <th>Stock</th>

              <th>Action</th>

            </tr>

          </thead>

          <tbody>

      `;


      snapshot.forEach((item) => {

        const product =
          item.data();


        const salePrice =
          product.salePrice;


        html += `

          <tr>

            <td>

              <img
                class="product-img"
                src="${escapeHtml(product.imageUrl || "")}"
                alt="${escapeHtml(product.name)}">

            </td>


            <td>
              ${escapeHtml(product.name)}
            </td>


            <td>
              ${escapeHtml(product.category)}
            </td>


            <td>

              ${
                salePrice !== null &&
                salePrice !== undefined
                  ? `<del>₹${product.price}</del>
                     ₹${salePrice}`
                  : `₹${product.price}`
              }

            </td>


            <td>
              ${product.stock}
            </td>


            <td>

              <button
                class="delete-btn"
                data-id="${item.id}">

                Delete

              </button>

            </td>

          </tr>

        `;

      });


      html += `

          </tbody>

        </table>

      `;


      productsContainer.innerHTML =
        html;


      /*
        DELETE BUTTONS
      */

      document
        .querySelectorAll(".delete-btn")
        .forEach((button) => {

          button.addEventListener(
            "click",
            () => {

              deleteProduct(
                button.dataset.id
              );

            }
          );

        });


    } catch (error) {

      console.error(
        "LOAD PRODUCTS ERROR:",
        error
      );


      productsContainer.innerHTML =
        `<div class="empty">
          Failed to load products.
        </div>`;

    }

  }


  /*
    DELETE PRODUCT

    NOTE:
    This deletes Firestore data.
    The GitHub image remains in the repository.
  */

  async function deleteProduct(
    productId
  ) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );


    if (!confirmed) return;


    try {

      await deleteDoc(
        doc(
          db,
          "products",
          productId
        )
      );


      showMessage(
        "Product deleted successfully.",
        "success"
      );


      loadProducts();


    } catch (error) {

      console.error(error);


      showMessage(
        "Delete failed: " +
        error.message,
        "error"
      );

    }

  }


  /*
    MESSAGE
  */

  function showMessage(
    text,
    type
  ) {

    message.textContent =
      text;


    message.className =
      "message " + type;


    message.style.display =
      "block";


    setTimeout(() => {

      message.style.display =
        "none";

    }, 5000);

  }


  /*
    HTML ESCAPE
  */

  function escapeHtml(text) {

    const div =
      document.createElement("div");


    div.textContent =
      text ?? "";


    return div.innerHTML;

  }

</script>

</body>

</html>
