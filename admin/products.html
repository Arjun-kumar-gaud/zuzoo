<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zuzoo - Products supabase </title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }

    .topbar h1 {
      font-size: 28px;
    }

    .topbar p {
      color: #777;
      margin-top: 5px;
    }

    .back-btn {
      text-decoration: none;
      background: #222;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 21px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #6c5ce7;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .image-preview {
      width: 180px;
      max-height: 180px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      display: none;
    }

    .add-btn {
      margin-top: 20px;
      width: 100%;
      border: none;
      background: #6c5ce7;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #5849d6;
    }

    .add-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #e8f8ef;
      color: #168344;
    }

    .error {
      background: #ffe9e9;
      color: #c62828;
    }

    .products-table {
      width: 100%;
      border-collapse: collapse;
    }

    .products-table th,
    .products-table td {
      padding: 13px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    .products-table th {
      background: #fafafa;
    }

    .product-thumb {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
    }

    .delete-btn {
      border: none;
      background: #ffe5e5;
      color: #d63031;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #ffd0d0;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .upload-progress {
      display: none;
      margin-top: 15px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #eee;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #6c5ce7;
      transition: width 0.2s ease;
    }

    @media(max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .card {
        padding: 18px;
        overflow-x: auto;
      }

      .products-table {
        min-width: 750px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- TOP BAR -->
  <div class="topbar">
    <div>
      <h1>Products</h1>
      <p>Manage your Zuzoo products</p>
    </div>

    <a href="dashboard.html" class="back-btn">
      ← Dashboard
    </a>
  </div>


  <!-- ADD PRODUCT -->
  <div class="card">

    <h2>➕ Add New Product</h2>

    <form id="productForm">

      <div class="form-grid">

        <!-- PRODUCT NAME -->
        <div class="form-group">

          <label>Product Name *</label>

          <input
            type="text"
            id="productName"
            placeholder="Enter product name"
            required>

        </div>


        <!-- CATEGORY -->
        <div class="form-group">

          <label>Category *</label>

          <select id="category" required>

            <option value="">
              Select Category
            </option>

            <option value="Fashion">
              Fashion
            </option>

            <option value="Electronics">
              Electronics
            </option>

            <option value="Beauty">
              Beauty
            </option>

            <option value="Home">
              Home
            </option>

            <option value="Accessories">
              Accessories
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <!-- PRICE -->
        <div class="form-group">

          <label>Price *</label>

          <input
            type="number"
            id="price"
            placeholder="₹ 0"
            min="0"
            step="0.01"
            required>

        </div>


        <!-- SALE PRICE -->
        <div class="form-group">

          <label>Sale Price</label>

          <input
            type="number"
            id="salePrice"
            placeholder="₹ 0"
            min="0"
            step="0.01">

        </div>


        <!-- STOCK -->
        <div class="form-group">

          <label>Stock *</label>

          <input
            type="number"
            id="stock"
            placeholder="Enter stock quantity"
            min="0"
            required>

        </div>


        <!-- IMAGE -->
        <div class="form-group">

          <label>Product Image *</label>

          <input
            type="file"
            id="productImage"
            accept="image/*"
            required>

          <img
            id="imagePreview"
            class="image-preview"
            alt="Image Preview">

        </div>


        <!-- DESCRIPTION -->
        <div class="form-group full">

          <label>Description *</label>

          <textarea
            id="description"
            placeholder="Enter product description"
            required></textarea>

        </div>

      </div>


      <!-- UPLOAD PROGRESS -->
      <div
        id="uploadProgress"
        class="upload-progress">

        <div class="progress-text">

          <span id="uploadStatus">
            Uploading image...
          </span>

          <span id="uploadPercent">
            0%
          </span>

        </div>

        <div class="progress-bar">

          <div
            id="progressFill"
            class="progress-fill">
          </div>

        </div>

      </div>


      <!-- ADD BUTTON -->
      <button
        type="submit"
        class="add-btn"
        id="addProductBtn">

        Add Product

      </button>


      <!-- MESSAGE -->
      <div
        id="message"
        class="message">
      </div>

    </form>

  </div>


  <!-- PRODUCT LIST -->
  <div class="card">

    <h2>📦 All Products</h2>

    <div id="productsContainer">

      <div class="loading">
        Loading products...
      </div>

    </div>

  </div>

</div>


<script>

  /* =====================================================
     SUPABASE CONFIG
  ===================================================== */

  const SUPABASE_URL =
    "https://wnqlbppkuqathlazubvu.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_FR6ESJgcnLJiAN0Fe2fig_6yZbjc9K";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     DOM
  ===================================================== */

  const productForm =
    document.getElementById("productForm");

  const imageInput =
    document.getElementById("productImage");

  const imagePreview =
    document.getElementById("imagePreview");

  const message =
    document.getElementById("message");

  const addProductBtn =
    document.getElementById("addProductBtn");

  const productsContainer =
    document.getElementById("productsContainer");

  const uploadProgress =
    document.getElementById("uploadProgress");

  const uploadStatus =
    document.getElementById("uploadStatus");

  const uploadPercent =
    document.getElementById("uploadPercent");

  const progressFill =
    document.getElementById("progressFill");


  /* =====================================================
     SELECTED IMAGE
  ===================================================== */

  let selectedImage = null;


  /* =====================================================
     LOAD PRODUCTS ON PAGE LOAD
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      loadProducts();

    }
  );


  /* =====================================================
     IMAGE PREVIEW
  ===================================================== */

  imageInput.addEventListener(
    "change",
    function () {

      selectedImage =
        this.files[0];

      if (!selectedImage) {

        imagePreview.style.display =
          "none";

        return;

      }


      /* IMAGE TYPE CHECK */

      if (
        !selectedImage.type.startsWith("image/")
      ) {

        showMessage(
          "Please select a valid image.",
          "error"
        );

        this.value = "";

        selectedImage = null;

        imagePreview.style.display =
          "none";

        return;

      }


      /* 5 MB LIMIT */

      if (
        selectedImage.size >
        5 * 1024 * 1024
      ) {

        showMessage(
          "Image must be smaller than 5 MB.",
          "error"
        );

        this.value = "";

        selectedImage = null;

        imagePreview.style.display =
          "none";

        return;

      }


      /* PREVIEW */

      const reader =
        new FileReader();

      reader.onload =
        function (e) {

          imagePreview.src =
            e.target.result;

          imagePreview.style.display =
            "block";

        };

      reader.readAsDataURL(
        selectedImage
      );

    }
  );


  /* =====================================================
     ADD PRODUCT
  ===================================================== */

  productForm.addEventListener(
    "submit",
    async function (e) {

      e.preventDefault();


      /* IMAGE CHECK */

      if (!selectedImage) {

        showMessage(
          "Please select a product image.",
          "error"
        );

        return;

      }


      try {

        /* DISABLE BUTTON */

        addProductBtn.disabled =
          true;

        addProductBtn.textContent =
          "Uploading Image...";


        /* FORM VALUES */

        const name =
          document
            .getElementById("productName")
            .value
            .trim();

        const category =
          document
            .getElementById("category")
            .value;

        const price =
          Number(
            document
              .getElementById("price")
              .value
          );

        const salePriceValue =
          document
            .getElementById("salePrice")
            .value;

        const salePrice =
          salePriceValue === ""
            ? null
            : Number(salePriceValue);

        const stock =
          Number(
            document
              .getElementById("stock")
              .value
          );

        const description =
          document
            .getElementById("description")
            .value
            .trim();


        /* VALIDATION */

        if (!name) {
          throw new Error(
            "Product name is required."
          );
        }

        if (!category) {
          throw new Error(
            "Please select a category."
          );
        }

        if (price < 0) {
          throw new Error(
            "Price cannot be negative."
          );
        }

        if (stock < 0) {
          throw new Error(
            "Stock cannot be negative."
          );
        }


        /* =================================================
           CREATE UNIQUE FILE NAME
        ================================================= */

        const extension =
          selectedImage.name
            .split(".")
            .pop()
            .toLowerCase();

        const safeName =
          name
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .substring(0, 50);

        const uniqueId =
          crypto.randomUUID();

        const fileName =
          `${safeName || "product"}_${uniqueId}.${extension}`;

        const storagePath =
          `products/${fileName}`;


        /* =================================================
           SHOW PROGRESS
        ================================================= */

        uploadProgress.style.display =
          "block";

        uploadStatus.textContent =
          "Uploading image...";

        uploadPercent.textContent =
          "0%";

        progressFill.style.width =
          "0%";


        /* =================================================
           SUPABASE STORAGE UPLOAD
        ================================================= */

        const {
          data: uploadData,
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("product-images")
            .upload(
              storagePath,
              selectedImage,
              {
                contentType:
                  selectedImage.type,

                cacheControl:
                  "31536000",

                upsert: false
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        /* UPLOAD COMPLETE */

        uploadPercent.textContent =
          "100%";

        progressFill.style.width =
          "100%";

        uploadStatus.textContent =
          "Image uploaded ✓";


        /* =================================================
           GET PUBLIC IMAGE URL
        ================================================= */

        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("product-images")
            .getPublicUrl(
              storagePath
            );


        const imageUrl =
          publicUrlData.publicUrl;


        /* =================================================
           SAVE PRODUCT TO SUPABASE
        ================================================= */

        addProductBtn.textContent =
          "Saving Product...";

        uploadStatus.textContent =
          "Saving product data...";


        const {
          data: productData,
          error: productError
        } =
          await supabaseClient
            .from("products")
            .insert([
              {
                name: name,

                category: category,

                price: price,

                salePrice: salePrice,

                stock: stock,

                description: description,

                imageUrl: imageUrl,

                storagePath: storagePath,

                createdAt:
                  new Date().toISOString()
              }
            ])
            .select();


        if (productError) {

          /*

            Database save failed.
            Remove uploaded image so
            unused image doesn't remain.

          */

          await supabaseClient
            .storage
            .from("product-images")
            .remove([
              storagePath
            ]);

          throw productError;

        }


        /* =================================================
           SUCCESS
        ================================================= */

        showMessage(
          "Product added successfully! 🎉",
          "success"
        );


        productForm.reset();

        imagePreview.src = "";

        imagePreview.style.display =
          "none";

        selectedImage =
          null;

        uploadProgress.style.display =
          "none";

        progressFill.style.width =
          "0%";


        loadProducts();


      } catch (error) {

        console.error(
          "ADD PRODUCT ERROR:",
          error
        );

        showMessage(
          "Error: " +
          (
            error.message ||
            "Something went wrong."
          ),
          "error"
        );

        uploadProgress.style.display =
          "none";

      }


      /* ENABLE BUTTON */

      addProductBtn.disabled =
        false;

      addProductBtn.textContent =
        "Add Product";

    }
  );


  /* =====================================================
     LOAD PRODUCTS
  ===================================================== */

  async function loadProducts() {

    try {

      productsContainer.innerHTML =
        `
        <div class="loading">
          Loading products...
        </div>
        `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select("*")
          .order(
            "createdAt",
            {
              ascending: false
            }
          );


      if (error) {

        throw error;

      }


      if (!data || data.length === 0) {

        productsContainer.innerHTML =
          `
          <div class="empty">
            No products added yet.
          </div>
          `;

        return;

      }


      let html =
        `
        <table class="products-table">

          <thead>

            <tr>

              <th>Image</th>

              <th>Name</th>

              <th>Category</th>

              <th>Price</th>

              <th>Stock</th>

              <th>Action</th>

            </tr>

          </thead>

          <tbody>
        `;


      data.forEach(
        (product) => {

          const salePrice =
            product.salePrice;


          const image =
            product.imageUrl
              ? `
                <img
                  src="${escapeHtml(product.imageUrl)}"
                  class="product-thumb"
                  alt="${escapeHtml(product.name)}"
                >
              `
              : "—";


          const price =
            salePrice !== null &&
            salePrice !== undefined

              ? `
                <del>
                  ₹${product.price}
                </del>
                <br>
                ₹${salePrice}
              `

              : `
                ₹${product.price}
              `;


          html +=
            `
            <tr>

              <td>
                ${image}
              </td>

              <td>
                ${escapeHtml(product.name)}
              </td>

              <td>
                ${escapeHtml(product.category)}
              </td>

              <td>
                ${price}
              </td>

              <td>
                ${escapeHtml(
                  String(
                    product.stock ?? 0
                  )
                )}
              </td>

              <td>

                <button
                  class="delete-btn"
                  data-id="${product.id}"
                  data-storage-path="${escapeHtml(
                    product.storagePath || ""
                  )}">

                  Delete

                </button>

              </td>

            </tr>
            `;

        }
      );


      html +=
        `
          </tbody>

        </table>
        `;


      productsContainer.innerHTML =
        html;


      /* DELETE BUTTONS */

      document
        .querySelectorAll(".delete-btn")
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                deleteProduct(
                  button.dataset.id,
                  button.dataset.storagePath
                );

              }
            );

          }
        );


    } catch (error) {

      console.error(
        "LOAD PRODUCTS ERROR:",
        error
      );

      productsContainer.innerHTML =
        `
        <div class="empty">
          Failed to load products.<br><br>
          ${escapeHtml(
            error.message || ""
          )}
        </div>
        `;

    }

  }


  /* =====================================================
     DELETE PRODUCT
  ===================================================== */

  async function deleteProduct(
    productId,
    storagePath
  ) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );


    if (!confirmed) {

      return;

    }


    try {

      /* DELETE DATABASE RECORD */

      const {
        error: deleteError
      } =
        await supabaseClient
          .from("products")
          .delete()
          .eq(
            "id",
            productId
          );


      if (deleteError) {

        throw deleteError;

      }


      /* DELETE IMAGE */

      if (storagePath) {

        const {
          error: storageError
        } =
          await supabaseClient
            .storage
            .from("product-images")
            .remove([
              storagePath
            ]);


        if (storageError) {

          console.warn(
            "Image delete failed:",
            storageError
          );

        }

      }


      showMessage(
        "Product deleted successfully.",
        "success"
      );


      loadProducts();


    } catch (error) {

      console.error(
        "DELETE PRODUCT ERROR:",
        error
      );

      showMessage(
        "Delete failed: " +
        (
          error.message ||
          "Something went wrong."
        ),
        "error"
      );

    }

  }


  /* =====================================================
     MESSAGE
  ===================================================== */

  function showMessage(
    text,
    type
  ) {

    message.textContent =
      text;

    message.className =
      "message " + type;

    message.style.display =
      "block";


    setTimeout(
      () => {

        message.style.display =
          "none";

      },
      5000
    );

  }


  /* =====================================================
     HTML ESCAPE
  ===================================================== */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text ?? "";

    return div.innerHTML;

  }

</script>

</body>
</html>
