  <style>

    * {

      margin: 0;

      font-family: Arial, sans-serif;

    body {
      background: #f5f6fa;

    .topbar {

    }


    .topbar h1 {
      font-size: 28px;

    .back-btn {

</head>


<body>


<div class="container">


  <!-- TOP BAR -->

  <div class="topbar">

    <div>

      <h1>Products</h1>

      <p>
        Manage your Zuzoo products
      </p>

    </div>


    <a href="dashboard.html"
       class="back-btn">

      ← Dashboard

    </a>

  </div>



  <!-- ADD PRODUCT -->

  <div class="card">

    <h2>➕ Add New Product</h2>


    <form id="productForm">


      <div class="form-grid">


        <!-- PRODUCT NAME -->

        <div class="form-group">

          <label>
            Product Name *
          </label>

          <input
            type="text"
            id="productName"
            placeholder="Enter product name"
            required>

        </div>



        <!-- CATEGORY -->

        <div class="form-group">

          <label>
            Category *
          </label>

          <select id="category" required>

            <option value="">
              Select Category
            </option>

            <option value="Fashion">
              Fashion
            </option>

            <option value="Electronics">
              Electronics
            </option>

            <option value="Beauty">
              Beauty
            </option>

            <option value="Home">
              Home
            </option>

            <option value="Accessories">
              Accessories
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>



        <!-- PRICE -->

        <div class="form-group">

          <label>
            Price *
          </label>

          <input
            type="number"
            id="price"
            placeholder="₹ 0"
            min="0"
            step="0.01"
            required>

        </div>



        <!-- SALE PRICE -->

        <div class="form-group">

          <label>
            Sale Price
          </label>

          <input
            type="number"
            id="salePrice"
            placeholder="₹ 0"
            min="0"
            step="0.01">

        </div>



        <!-- STOCK -->

        <div class="form-group">

          <label>
            Stock *
          </label>

          <input
            type="number"
            id="stock"
            placeholder="Enter stock quantity"
            min="0"
            required>

        </div>



        <!-- IMAGE -->

        <div class="form-group">

          <label>
            Product Image *
          </label>


          <div class="image-box">

            <input
              type="file"
              id="productImage"
              accept="image/jpeg,image/png,image/webp,image/gif"
              required>


            <img
              id="imagePreview"
              alt="Image Preview">

          </div>


          <!-- UPLOAD PROGRESS -->

          <div
            class="upload-progress"
            id="uploadProgress">

            <div class="progress-text">

              <span id="uploadStatus">
                Uploading image...
              </span>

              <span id="uploadPercent">
                0%
              </span>

            </div>


            <div class="progress-bar">

              <div
                class="progress-fill"
                id="progressFill">
              </div>

            </div>

          </div>

        </div>



        <!-- DESCRIPTION -->

        <div class="form-group full">

          <label>
            Description *
          </label>

          <textarea
            id="description"
            placeholder="Enter product description"
            required></textarea>

        </div>


      </div>



      <!-- ADD BUTTON -->

      <button
        type="submit"
        class="add-btn"
        id="addProductBtn">

        Add Product

      </button>



      <!-- MESSAGE -->

      <div
        id="message"
        class="message">
      </div>


    </form>

  </div>



  <!-- PRODUCT LIST -->

  <div class="card">

    <h2>📦 All Products</h2>


    <div id="productsContainer">

      <div class="loading">
        Loading products...
      </div>

    </div>

  </div>


</div>



<script type="module">


  /*
  =====================================================
  FIREBASE
  =====================================================
  */

  import {
    auth,
    db,
    storage
  } from "./js/firebase.js";


  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


  import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  import {
    ref,
    uploadBytesResumable,
    getDownloadURL,
    deleteObject
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";



  /*
  =====================================================
  DOM
  =====================================================
  */

  const productForm =
    document.getElementById("productForm");


  const imageInput =
    document.getElementById("productImage");


  const imagePreview =
    document.getElementById("imagePreview");


  const message =
    document.getElementById("message");


  const addProductBtn =
    document.getElementById("addProductBtn");


  const productsContainer =
    document.getElementById("productsContainer");


  const uploadProgress =
    document.getElementById("uploadProgress");


  const uploadStatus =
    document.getElementById("uploadStatus");


  const uploadPercent =
    document.getElementById("uploadPercent");


  const progressFill =
    document.getElementById("progressFill");



  /*
  =====================================================
  SELECTED IMAGE
  =====================================================
  */

  let selectedImage = null;



  /*
  =====================================================
  AUTH CHECK
  =====================================================
  */

  onAuthStateChanged(auth, (user) => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }

    loadProducts();

  });



  /*
  =====================================================
  IMAGE PREVIEW
  =====================================================
  */

  imageInput.addEventListener(
    "change",
    function () {

      selectedImage =
        this.files[0];


      if (!selectedImage) {

        imagePreview.style.display =
          "none";

        return;

      }



      /*
      IMAGE TYPE CHECK
      */

      if (!selectedImage.type.startsWith("image/")) {

        showMessage(
          "Please select a valid image.",
          "error"
        );

        this.value = "";

        selectedImage = null;

        imagePreview.style.display =
          "none";

        return;

      }



      /*
      5 MB LIMIT
      */

      if (selectedImage.size >
          5 * 1024 * 1024) {

        showMessage(
          "Image must be smaller than 5 MB.",
          "error"
        );

        this.value = "";

        selectedImage = null;

        imagePreview.style.display =
          "none";

        return;

      }



      /*
      PREVIEW
      */

      const reader =
        new FileReader();


      reader.onload =
        function (e) {

          imagePreview.src =
            e.target.result;

          imagePreview.style.display =
            "block";

        };


      reader.readAsDataURL(selectedImage);

    }
  );



  /*
  =====================================================
  ADD PRODUCT
  =====================================================
  */

  productForm.addEventListener(
    "submit",
    async function (e) {

      e.preventDefault();



      /*
      IMAGE CHECK
      */

      if (!selectedImage) {

        showMessage(
          "Please select a product image.",
          "error"
        );

        return;

      }



      try {


        /*
        DISABLE BUTTON
        */

        addProductBtn.disabled =
          true;


        addProductBtn.textContent =
          "Uploading Image...";



        /*
        GET FORM VALUES
        */

        const name =
          document
            .getElementById("productName")
            .value
            .trim();


        const category =
          document
            .getElementById("category")
            .value;


        const price =
          Number(
            document
              .getElementById("price")
              .value
          );


        const salePriceValue =
          document
            .getElementById("salePrice")
            .value;


        const salePrice =
          salePriceValue === ""
            ? null
            : Number(salePriceValue);


        const stock =
          Number(
            document
              .getElementById("stock")
              .value
          );


        const description =
          document
            .getElementById("description")
            .value
            .trim();



        /*
        =================================================
        CREATE UNIQUE FILE NAME
        =================================================
        */

        const extension =
          selectedImage.name
            .split(".")
            .pop()
            .toLowerCase();


        const safeName =
          name
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .substring(0, 50);


        const uniqueId =
          crypto.randomUUID();


        const fileName =
          `${safeName || "product"}_${uniqueId}.${extension}`;


        const storagePath =
          `products/${fileName}`;



        /*
        =================================================
        FIREBASE STORAGE REFERENCE
        =================================================
        */

        const imageRef =
          ref(
            storage,
            storagePath
          );



        /*
        =================================================
        UPLOAD PROGRESS SHOW
        =================================================
        */

        uploadProgress.style.display =
          "block";


        uploadStatus.textContent =
          "Uploading image...";


        uploadPercent.textContent =
          "0%";


        progressFill.style.width =
          "0%";



        /*
        =================================================
        FIREBASE STORAGE UPLOAD
        =================================================
        */

        const uploadTask =
          uploadBytesResumable(
            imageRef,
            selectedImage,
            {
              contentType:
                selectedImage.type,

              cacheControl:
                "public,max-age=31536000"
            }
          );



        /*
        WAIT FOR UPLOAD
        */

        const imageUrl =
          await new Promise(
            (resolve, reject) => {


              uploadTask.on(
                "state_changed",


                /*
                PROGRESS
                */

                (snapshot) => {

                  const progress =
                    Math.round(
                      (
                        snapshot.bytesTransferred /
                        snapshot.totalBytes
                      ) * 100
                    );


                  uploadPercent.textContent =
                    `${progress}%`;


                  progressFill.style.width =
                    `${progress}%`;

                },


                /*
                ERROR
                */

                (error) => {

                  reject(error);

                },


                /*
                COMPLETE
                */

                async () => {

                  try {

                    const url =
                      await getDownloadURL(
                        uploadTask.snapshot.ref
                      );

                    resolve(url);

                  } catch (error) {

                    reject(error);

                  }

                }

              );

            }
          );



        /*
        =================================================
        SAVE PRODUCT TO FIRESTORE
        =================================================
        */

        addProductBtn.textContent =
          "Saving Product...";


        uploadStatus.textContent =
          "Image uploaded ✓";


        await addDoc(
          collection(
            db,
            "products"
          ),
          {

            name:
              name,

            category:
              category,

            price:
              price,

            salePrice:
              salePrice,

            stock:
              stock,

            description:
              description,

            imageUrl:
              imageUrl,

            storagePath:
              storagePath,

            createdAt:
              serverTimestamp()

          }
        );



        /*
        =================================================
        SUCCESS
        =================================================
        */

        showMessage(
          "Product added successfully! 🎉",
          "success"
        );


        productForm.reset();


        imagePreview.style.display =
          "none";


        selectedImage =
          null;


        uploadProgress.style.display =
          "none";


        progressFill.style.width =
          "0%";


        uploadPercent.textContent =
          "0%";


        loadProducts();


      } catch (error) {


        console.error(
          "ADD PRODUCT ERROR:",
          error
        );


        /*
        FIREBASE ERROR MESSAGE
        */

        let errorMessage =
          error.message ||
          "Something went wrong.";


        if (
          error.code ===
          "storage/unauthorized"
        ) {

          errorMessage =
            "Upload permission denied. Please check Firebase Storage Rules.";

        }


        if (
          error.code ===
          "storage/quota-exceeded"
        ) {

          errorMessage =
            "Firebase Storage quota exceeded.";

        }


        if (
          error.code ===
          "storage/canceled"
        ) {

          errorMessage =
            "Image upload was cancelled.";

        }


        showMessage(
          "Error: " +
          errorMessage,
          "error"
        );


        uploadProgress.style.display =
          "none";

      }



      /*
      ENABLE BUTTON
      */

      addProductBtn.disabled =
        false;


      addProductBtn.textContent =
        "Add Product";

    }

  );



  /*
  =====================================================
  LOAD PRODUCTS
  =====================================================
  */

  async function loadProducts() {

    try {


      productsContainer.innerHTML =
        `<div class="loading">
          Loading products...
        </div>`;


      const snapshot =
        await getDocs(
          collection(
            db,
            "products"
          )
        );



      if (snapshot.empty) {

        productsContainer.innerHTML =
          `<div class="empty">
            No products added yet.
          </div>`;

        return;

      }



      let html = `

        <table class="products-table">

          <thead>

            <tr>

              <th>Image</th>

              <th>Name</th>

              <th>Category</th>

              <th>Price</th>

              <th>Stock</th>

              <th>Action</th>

            </tr>

          </thead>

          <tbody>

      `;



      snapshot.forEach((item) => {


        const product =
          item.data();


        const salePrice =
          product.salePrice;



        html += `

          <tr>

            <td>

              <img
                class="product-img"
                src="${escapeHtml(product.imageUrl || "")}"
                alt="${escapeHtml(product.name)}"
                onerror="this.style.display='none'">

            </td>


            <td>
              ${escapeHtml(product.name)}
            </td>


            <td>
              ${escapeHtml(product.category)}
            </td>


            <td>

              ${
                salePrice !== null &&
                salePrice !== undefined

                  ? `<del>₹${product.price}</del>
                     ₹${salePrice}`

                  : `₹${product.price}`
              }

            </td>


            <td>
              ${escapeHtml(String(product.stock ?? 0))}
            </td>


            <td>

              <button
                class="delete-btn"
                data-id="${item.id}"
                data-storage-path="${escapeHtml(product.storagePath || "")}">

                Delete

              </button>

            </td>

          </tr>

        `;

      });



      html += `

          </tbody>

        </table>

      `;



      productsContainer.innerHTML =
        html;



      /*
      =================================================
      DELETE BUTTONS
      =================================================
      */

      document
        .querySelectorAll(".delete-btn")
        .forEach((button) => {

          button.addEventListener(
            "click",
            () => {

              deleteProduct(
                button.dataset.id,
                button.dataset.storagePath
              );

            }
          );

        });



    } catch (error) {


      console.error(
        "LOAD PRODUCTS ERROR:",
        error
      );


      productsContainer.innerHTML =
        `<div class="empty">
          Failed to load products.
        </div>`;

    }

  }



  /*
  =====================================================
  DELETE PRODUCT
  =====================================================
  */

  async function deleteProduct(
    productId,
    storagePath
  ) {


    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );


    if (!confirmed) return;



    try {


      /*
      DELETE FIRESTORE DOCUMENT
      */

      await deleteDoc(
        doc(
          db,
          "products",
          productId
        )
      );



      /*
      DELETE IMAGE FROM FIREBASE STORAGE
      */

      if (storagePath) {

        try {

          const imageRef =
            ref(
              storage,
              storagePath
            );


          await deleteObject(
            imageRef
          );

        } catch (storageError) {

          console.warn(
            "Storage image delete failed:",
            storageError
          );

        }

      }



      showMessage(
        "Product deleted successfully.",
        "success"
      );


      loadProducts();



    } catch (error) {


      console.error(
        "DELETE PRODUCT ERROR:",
        error
      );


      showMessage(
        "Delete failed: " +
        error.message,
        "error"
      );

    }

  }



  /*
  =====================================================
  MESSAGE
  =====================================================
  */

  function showMessage(
    text,
    type
  ) {


    message.textContent =
      text;


    message.className =
      "message " + type;


    message.style.display =
      "block";


    setTimeout(() => {

      message.style.display =
        "none";

    }, 5000);

  }



  /*
  =====================================================
  HTML ESCAPE
  =====================================================
  */

  function escapeHtml(text) {

    const div =
      document.createElement("div");


    div.textContent =
      text ?? "";


    return div.innerHTML;

  }


</script>


</body>

</html>
```
