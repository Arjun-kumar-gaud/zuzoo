<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Zuzoo Admin Login</title>

  <link rel="stylesheet"
        href="css/admin.css">

</head>


<body class="login-body">


  <div class="login-container">


    <div class="login-card">


      <div class="logo">

        <div class="logo-icon">
          Z
        </div>

        <h1>ZUZOO</h1>

        <span>ADMIN PANEL</span>

      </div>


      <div class="login-heading">

        <h2>Welcome Back 👋</h2>

        <p>
          Login to manage your Zuzoo store
        </p>

      </div>


      <form id="loginForm">


        <div class="input-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="admin@zuzoo.com"
            required
          >

        </div>


        <div class="input-group">

          <label for="password">
            Password
          </label>

          <div class="password-box">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              id="togglePassword">
              👁
            </button>

          </div>

        </div>


        <div
          id="loginMessage"
          class="login-message">
        </div>


        <button
          type="submit"
          id="loginButton"
          class="login-button">

          <span id="buttonText">
            Login to Dashboard
          </span>

        </button>


      </form>


      <div class="login-footer">

        <span>🔒 Secure Admin Access</span>

      </div>


    </div>


  </div>


  <script type="module"
          src="js/auth.js">
  </script>

</body>

</html>
