
```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon | Website Under Construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(38px, 8vw, 70px);
            color: #d4af37;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        h2 {
            font-size: clamp(22px, 5vw, 32px);
            margin-bottom: 20px;
        }

        p {
            color: #cccccc;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid #444;
            border-top: 5px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        .btn {
            display: inline-block;
            padding: 13px 28px;
            border: 1px solid #d4af37;
            color: #d4af37;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #d4af37;
            color: #111111;
        }

        .footer {
            margin-top: 45px;
            font-size: 13px;
            color: #777777;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🚧</div>

        <h1>Coming Soon</h1>

        <h2>Website Under Construction</h2>

        <p>
            We are working hard to bring you something amazing.
            Our new website is currently under construction.
            Please visit us again soon!
        </p>

        <div class="loader"></div>

        <a href="mailto:your@email.com" class="btn">
            Contact Us
        </a>

        <div class="footer">
            © 2026 Your Website. All Rights Reserved.
        </div>

    </div>

</body>
</html>
