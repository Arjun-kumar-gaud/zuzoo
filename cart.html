<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Zuzoo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family:'Inter',sans-serif; background:#f4f6fa; padding-bottom:90px; }
:root { --z-purple:#6a1b9a; --z-navy:#0d1b2a; }
.text-purple { color:var(--z-purple)!important; }
.z-header { background:#fff; box-shadow:0 2px 12px rgba(13,27,42,.08); }
.z-logo { font-weight:700; font-size:1.6rem; color:var(--z-purple); text-decoration:none; }
.z-logo span { color:var(--z-navy); }
.btn-purple { background:var(--z-purple); color:#fff; border:none; }
.btn-purple:hover { background:#8e24aa; color:#fff; }
.cart-item { background:#fff; border-radius:14px; padding:12px; margin-bottom:12px; display:flex; gap:12px; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.04); }
.cart-item img { width:80px; height:80px; object-fit:contain; background:#f0f2f6; border-radius:10px; }
.qty-btn { border:1px solid #ddd; background:#fff; width:30px; height:30px; border-radius:6px; font-weight:600; }
.summary-box { background:#fff; border-radius:14px; padding:18px; box-shadow:0 4px 12px rgba(0,0,0,.05); position:sticky; top:20px; }
.cart-count-badge { background:var(--z-purple); color:#fff; border-radius:40px; padding:.1rem .5rem; font-size:.65rem; position:absolute; top:-4px; right:-8px; }
</style>
</head>
<body>

<header class="z-header py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="index.html" class="z-logo">ZUZ<span>OO</span></a>
    <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Continue Shopping</a>
  </div>
</header>

<div class="container py-4">
  <h3 class="mb-4"><i class="bi bi-cart3 text-purple"></i> Shopping Cart</h3>
  <div class="row g-4">
    <div class="col-lg-8">
      <div id="cartList"></div>
    </div>
    <div class="col-lg-4">
      <div class="summary-box">
        <h5 class="mb-3">Order Summary</h5>
        <div class="d-flex justify-content-between mb-2">
          <span>Subtotal</span><strong id="sumSubtotal">₹0</strong>
        </div>
        <div class="d-flex justify-content-between mb-2">
          <span>Shipping</span><strong id="sumShipping">₹0</strong>
        </div>
        <hr>
        <div class="d-flex justify-content-between mb-3 fs-5">
          <span>Total</span><strong class="text-purple" id="sumTotal">₹0</strong>
        </div>
        <button class="btn btn-purple w-100 py-2" onclick="goCheckout()">
          Proceed to Checkout <i class="bi bi-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script>
const SHIPPING_FREE_ABOVE = 499;
const SHIPPING_FEE = 49;

function render() {
  const cart = getCart();
  const list = document.getElementById("cartList");

  if (!cart.length) {
    list.innerHTML = `<div class="text-center py-5 bg-white rounded-4">
      <i class="bi bi-cart-x" style="font-size:4rem;color:#ccc;"></i>
      <h5 class="mt-3">Your cart is empty</h5>
      <a href="index.html" class="btn btn-purple mt-2">Start Shopping</a>
    </div>`;
  } else {
    list.innerHTML = cart.map(item => `
      <div class="cart-item">
        <img src="${escapeHtml(item.image || '')}" onerror="this.src='https://placehold.co/100x100?text=No+Image'">
        <div class="flex-grow-1">
          <div class="fw-semibold">${escapeHtml(item.name)}</div>
          <div class="text-purple fw-bold">₹${formatPrice(item.price)}</div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
          <span class="fw-semibold" style="min-width:24px;text-align:center;">${item.quantity}</span>
          <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
        </div>
        <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.id})">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    `).join("");
  }

  const subtotal = cartTotal();
  const shipping = subtotal >= SHIPPING_FREE_ABOVE || subtotal === 0 ? 0 : SHIPPING_FEE;
  document.getElementById("sumSubtotal").textContent = "₹" + formatPrice(subtotal);
  document.getElementById("sumShipping").textContent = shipping === 0 ? "FREE" : "₹" + formatPrice(shipping);
  document.getElementById("sumTotal").textContent = "₹" + formatPrice(subtotal + shipping);
  updateCartBadges();
}

function changeQty(id, delta) {
  const cart = getCart();
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.quantity = Math.max(1, item.quantity + delta);
  saveCart(cart);
  render();
}

function removeItem(id) {
  removeFromCart(id);
  render();
  toast("Item removed");
}

function goCheckout() {
  if (!getCart().length) { toast("Cart is empty", "warning"); return; }
  window.location.href = "checkout.html";
}

render();
</script>
</body>
</html>
