<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zuzoo - Firebase Test</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .firebase-status {
      max-width: 500px;
      margin: 20px auto 0;
      padding: 12px;
      background: #fff3cd;
      color: #856404;
      border-radius: 8px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-bottom: 8px;
    }

    .card p {
      color: #666;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      text-align: center;
    }

    .success {
      display: block !important;
      background: #d1fae5;
      color: #065f46;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Zuzoo</h1>
  </header>

  <!-- Firebase connection status -->
  <div id="firebaseStatus" class="firebase-status">
    Connecting to Firebase...
  </div>


  <main class="container">

    <div class="card">

      <h2>Test Form</h2>

      <p>
        Enter your details. This data will be saved in Firestore.
      </p>

      <form id="userForm">

        <div class="form-group">
          <label for="name">Name</label>

          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
          >
        </div>


        <div class="form-group">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>


        <button type="submit" id="saveButton">
          Save Data
        </button>

      </form>


      <div id="message"></div>

    </div>

  </main>


  <footer>
    © 2026 Zuzoo
  </footer>


  <!-- Firebase -->
  <script type="module">

    // Firebase App
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    // Firestore
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // Firebase configuration
    const firebaseConfig = {

      apiKey: "AIzaSyBVMATK68o-lLNI2ESxY2FTvrtwiPBeTRY",

      authDomain: "zuzoo-6afa5.firebaseapp.com",

      projectId: "zuzoo-6afa5",

      storageBucket: "zuzoo-6afa5.firebasestorage.app",

      messagingSenderId: "560745524336",

      appId: "1:560745524336:web:3db8ae577ccb65456598b5",

      measurementId: "G-RR5MN45J4S"

    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);


    // Initialize Firestore
    const db = getFirestore(app);


    // Firebase status
    const firebaseStatus =
      document.getElementById("firebaseStatus");


    firebaseStatus.textContent =
      "Firebase connected successfully ✅";

    firebaseStatus.style.background = "#d1fae5";
    firebaseStatus.style.color = "#065f46";


    console.log("Firebase connected:", app.name);


    // Form elements
    const form =
      document.getElementById("userForm");

    const nameInput =
      document.getElementById("name");

    const emailInput =
      document.getElementById("email");

    const saveButton =
      document.getElementById("saveButton");

    const message =
      document.getElementById("message");


    // Form submit
    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      const name =
        nameInput.value.trim();

      const email =
        emailInput.value.trim();


      if (!name || !email) {

        showMessage(
          "Please enter name and email.",
          "error"
        );

        return;
      }


      // Disable button
      saveButton.disabled = true;
      saveButton.textContent = "Saving...";


      try {

        // Save data to Firestore
        const docRef = await addDoc(
          collection(db, "users"),
          {
            name: name,
            email: email,
            createdAt: serverTimestamp()
          }
        );


        console.log(
          "Document saved successfully:",
          docRef.id
        );


        showMessage(
          "Data saved successfully! ✅",
          "success"
        );


        // Clear form
        form.reset();


      } catch (error) {

        console.error(
          "Firestore error:",
          error
        );


        showMessage(
          "Error: " + error.message,
          "error"
        );

      }


      // Enable button
      saveButton.disabled = false;
      saveButton.textContent = "Save Data";

    });


    // Message function
    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }

  </script>

</body>
</html>
