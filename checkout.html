<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Zuzoo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family:'Inter',sans-serif; background:#f4f6fa; }
:root { --z-purple:#6a1b9a; --z-navy:#0d1b2a; }
.text-purple { color:var(--z-purple)!important; }
.z-header { background:#fff; box-shadow:0 2px 12px rgba(13,27,42,.08); }
.z-logo { font-weight:700; font-size:1.6rem; color:var(--z-purple); text-decoration:none; }
.z-logo span { color:var(--z-navy); }
.btn-purple { background:var(--z-purple); color:#fff; border:none; }
.btn-purple:hover { background:#8e24aa; color:#fff; }
.card-box { background:#fff; border-radius:14px; padding:20px; box-shadow:0 4px 12px rgba(0,0,0,.05); margin-bottom:16px; }
.summary-box { background:#fff; border-radius:14px; padding:20px; box-shadow:0 4px 12px rgba(0,0,0,.05); position:sticky; top:20px; }
</style>
</head>
<body>

<header class="z-header py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="index.html" class="z-logo">ZUZ<span>OO</span></a>
    <a href="cart.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Cart</a>
  </div>
</header>

<div class="container py-4">
  <h3 class="mb-4"><i class="bi bi-bag-check text-purple"></i> Checkout</h3>
  <div class="row g-4">
    <div class="col-lg-7">
      <form id="checkoutForm">
        <div class="card-box">
          <h5 class="mb-3">Shipping Details</h5>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone *</label>
              <input type="tel" class="form-control" id="phone" required pattern="[0-9]{10}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Pincode *</label>
              <input type="text" class="form-control" id="pincode" required pattern="[0-9]{6}">
            </div>
            <div class="col-12">
              <label class="form-label">Address *</label>
              <textarea class="form-control" id="address" rows="2" required></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">City *</label>
              <input type="text" class="form-control" id="city" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">State *</label>
              <input type="text" class="form-control" id="state" required>
            </div>
          </div>
        </div>

        <div class="card-box">
          <h5 class="mb-3">Payment Method</h5>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="payment" id="payCOD" value="cod" checked>
            <label class="form-check-label" for="payCOD"><i class="bi bi-cash-coin text-success"></i> Cash on Delivery</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" id="payOnline" value="online">
            <label class="form-check-label" for="payOnline"><i class="bi bi-credit-card text-primary"></i> Online Payment (Demo)</label>
          </div>
        </div>
      </form>
    </div>

    <div class="col-lg-5">
      <div class="summary-box">
        <h5 class="mb-3">Order Summary</h5>
        <div id="itemsPreview" style="max-height:280px;overflow:auto;"></div>
        <hr>
        <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><strong id="sumSubtotal">₹0</strong></div>
        <div class="d-flex justify-content-between mb-2"><span>Shipping</span><strong id="sumShipping">₹0</strong></div>
        <hr>
        <div class="d-flex justify-content-between mb-3 fs-5"><span>Total</span><strong class="text-purple" id="sumTotal">₹0</strong></div>
        <button class="btn btn-purple w-100 py-2" id="placeOrderBtn">
          <i class="bi bi-check-circle me-1"></i>Place Order
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
const SHIPPING_FREE_ABOVE = 499;
const SHIPPING_FEE = 49;
let currentUser = null;

(async function init() {
  currentUser = await getCurrentUser();
  if (!currentUser) {
    toast("Please login to checkout", "warning");
    setTimeout(() => window.location.href = "login.html?redirect=checkout.html", 1200);
    return;
  }

  // Prefill
  const meta = currentUser.user_metadata || {};
  document.getElementById("fullName").value = meta.full_name || "";
  document.getElementById("phone").value = meta.phone || "";

  renderSummary();
})();

function renderSummary() {
  const cart = getCart();
  const preview = document.getElementById("itemsPreview");
  preview.innerHTML = cart.map(i => `
    <div class="d-flex align-items-center gap-2 mb-2">
      <img src="${escapeHtml(i.image)}" style="width:50px;height:50px;object-fit:contain;background:#f0f2f6;border-radius:8px;"
           onerror="this.src='https://placehold.co/60x60?text=?'">
      <div class="flex-grow-1">
        <div style="font-size:.85rem;font-weight:600;">${escapeHtml(i.name)}</div>
        <small class="text-muted">Qty: ${i.quantity} × ₹${formatPrice(i.price)}</small>
      </div>
      <strong>₹${formatPrice(i.price * i.quantity)}</strong>
    </div>
  `).join("");

  const subtotal = cartTotal();
  const shipping = subtotal >= SHIPPING_FREE_ABOVE ? 0 : SHIPPING_FEE;
  document.getElementById("sumSubtotal").textContent = "₹" + formatPrice(subtotal);
  document.getElementById("sumShipping").textContent = shipping === 0 ? "FREE" : "₹" + formatPrice(shipping);
  document.getElementById("sumTotal").textContent = "₹" + formatPrice(subtotal + shipping);
}

document.getElementById("placeOrderBtn").addEventListener("click", async () => {
  const form = document.getElementById("checkoutForm");
  if (!form.checkValidity()) { form.reportValidity(); return; }

  const cart = getCart();
  if (!cart.length) { toast("Cart is empty", "warning"); return; }

  const btn = document.getElementById("placeOrderBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Placing...`;

  try {
    const subtotal = cartTotal();
    const shipping = subtotal >= SHIPPING_FREE_ABOVE ? 0 : SHIPPING_FEE;
    const total = subtotal + shipping;

    const orderNumber = "ZZ" + Date.now().toString().slice(-9);
    const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

    const orderPayload = {
      user_id: currentUser.id,
      order_number: orderNumber,
      subtotal,
      shipping,
      total,
      status: "pending",
      payment_method: paymentMethod,
      full_name: document.getElementById("fullName").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      address: document.getElementById("address").value.trim(),
      city: document.getElementById("city").value.trim(),
      state: document.getElementById("state").value.trim(),
      pincode: document.getElementById("pincode").value.trim()
    };

    const { data: orderData, error: orderErr } = await supabaseClient
      .from("orders").insert(orderPayload).select().single();
    if (orderErr) throw orderErr;

    const items = cart.map(i => ({
      order_id: orderData.id,
      product_id: i.id,
      product_name: i.name,
      product_image: i.image,
      price: i.price,
      quantity: i.quantity
    }));

    const { error: itemsErr } = await supabaseClient.from("order_items").insert(items);
    if (itemsErr) throw itemsErr;

    clearCart();
    toast("Order placed successfully! ✓");
    setTimeout(() => window.location.href = "orders.html", 800);
  } catch (err) {
    console.error(err);
    toast("Order failed: " + err.message, "danger");
    btn.disabled = false;
    btn.innerHTML = `<i class="bi bi-check-circle me-1"></i>Place Order`;
  }
});
</script>
</body>
</html>
